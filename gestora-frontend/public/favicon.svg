<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Stesso simbolo del logo in-app (src/components/Logo.tsx): un tavolo visto dall'alto con
    quattro coperti attorno. Qui i colori sono scritti a mano e non presi dal tema, perche' la
    scheda del browser non ha accesso al CSS dell'applicazione.
    Ambra #a15c28 = --primary del tema chiaro, su fondo crema.
  -->
  <rect width="32" height="32" rx="7" fill="#faf7f2" />
  <g fill="none" stroke="#a15c28" stroke-width="2.5" stroke-linecap="round">
    <circle cx="16" cy="16" r="6.5" />
    <path d="M16 4.5v2.5M16 25v2.5M4.5 16h2.5M25 16h2.5" />
  </g>
</svg>

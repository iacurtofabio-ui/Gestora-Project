name: Build e pubblica immagine Docker backend

on:
  push:
    branches: [main]
    paths:
      - "GestoraWebApi/**"
      - ".github/workflows/docker-publish.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login su Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./GestoraWebApi
          file: ./GestoraWebApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestora-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gestora-api:${{ github.sha }}

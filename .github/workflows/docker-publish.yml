name: Build e pubblica immagine Docker backend

on:
  push:
    branches: [main]
    paths:
      - "GestoraWebApi/**"
      - ".github/workflows/docker-publish.yml"

jobs:
  # AUD-M9: l'immagine veniva pubblicata (e Azure la prende da sola) anche con i test rossi:
  # CI Backend gira in parallelo e non blocca nulla. Ora i test sono un passo obbligato.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GestoraWebApi
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login su Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./GestoraWebApi
          file: ./GestoraWebApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gestora-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gestora-api:${{ github.sha }}

name: CI Backend

on:
  push:
    branches: [main, dev]
    paths:
      - 'GestoraWebApi/**'
      - 'GestoraWebApi.Tests/**'
      - 'Gestora.sln'
      - 'global.json'
  pull_request:
    branches: [main, dev]
    paths:
      - 'GestoraWebApi/**'
      - 'GestoraWebApi.Tests/**'
      - 'Gestora.sln'
      - 'global.json'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Si lavora dalla radice: la soluzione Gestora.sln contiene sia l'API sia i test.
      - name: Restore
        run: dotnet restore Gestora.sln

      - name: Build
        run: dotnet build Gestora.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Gestora.sln --no-build --configuration Release --logger "console;verbosity=normal"
